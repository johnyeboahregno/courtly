name: Purge test users

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Actually delete the matched users (leave unchecked for a dry run)'
        type: boolean
        default: false

jobs:
  purge:
    name: Purge test users on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run users:purge-test
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<REMOTE
          set -e
          cd ~/courtly
          if [ "${{ inputs.force }}" = "true" ]; then
            sudo docker compose exec -T app php artisan users:purge-test --force --no-interaction
          else
            sudo docker compose exec -T app php artisan users:purge-test
          fi
          REMOTE
