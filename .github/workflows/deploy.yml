name: Deploy to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
            set -e
            cd ~/courtly
            git fetch origin master
            git reset --hard origin/master
            sudo docker compose build app queue
            sudo docker compose up -d --force-recreate app queue
            sudo docker compose exec -T app php artisan migrate --force
            sudo docker compose ps --format 'table {{.Name}}\t{{.Status}}'
          REMOTE
