name: Deploy to FTP

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, zip

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via lftp
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          timeout 12m lftp -p 666 -u "regnocloud,$FTP_PASSWORD" ftp.bytedemon.com <<'EOF'
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set net:persist-retries 0
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          mkdir -p public_html/courtly2/storage/framework/cache
          mkdir -p public_html/courtly2/storage/framework/sessions
          mkdir -p public_html/courtly2/storage/framework/views
          mkdir -p public_html/courtly2/storage/logs
          mkdir -p public_html/courtly2/storage/app
          mirror --reverse --verbose --parallel=4 \
            --exclude-glob '.git/' \
            --exclude-glob '.gitignore' \
            --exclude-glob '.github/' \
            --exclude-glob '.env' \
            --exclude-glob '.env.example' \
            --exclude-glob 'storage/' \
            --exclude-glob 'bootstrap/cache/' \
            --exclude-glob 'public/' \
            --exclude-glob '*.log' \
            --exclude-glob 'README.md' \
            --exclude-glob 'CLAUDE.md' \
            --exclude-glob 'USER_GUIDE.md' \
            --exclude-glob 'test.html' \
            --exclude-glob 'debug.php' \
            --exclude-glob 'info.php' \
            --exclude-glob 'start.bat' \
            --exclude-glob 'start.sh' \
            --exclude-glob 'composer.phar' \
            --exclude-glob 'composer.lock' \
            --exclude-glob 'cacert.pem' \
            --exclude-glob 'peg-board.md' \
            ./ public_html/courtly2/
          quit
          EOF
